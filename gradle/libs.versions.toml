[versions]
guava = "33.0.0-jre"
junit-jupiter = "5.10.2"
assertj = "3.24.2"
quicktheories = "0.26"
mockito = "4.10.0"
cassandra-analytics = "0.2.0"
jetbrains-annotations = "23.0.0"
slf4j-api = "1.7.30"
kryo = "4.0.2"
jackson = "2.12.7"
spark = "3.2.2"
jna = "5.9.0"

