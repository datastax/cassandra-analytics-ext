cassandra-four-zero-types = { module = "org.apache.cassandra:cassandra-four-zero-types", version.ref = "cassandra-analytics" }
cassandra-four-zero-avro-converter = { module = "org.apache.cassandra:cassandra-four-zero-avro-converter", version.ref = "cassandra-analytics" }
cassandra-analytics-spark-four-zero-converter = { module = "org.apache.cassandra:cassandra-analytics-spark-four-zero-converter_spark3_2.13", version.ref = "cassandra-analytics" }
cassandra-five-zero-bridge = { module = "org.apache.cassandra:cassandra-five-zero-bridge", version.ref = "cassandra-analytics" }