cassandra-analytics-core = { module = "org.apache.cassandra:cassandra-analytics-core_spark3_2.13", version.ref = "cassandra-analytics" }
cassandra-analytics-bridge = { module = "org.apache.cassandra:cassandra-bridge_spark3_2.13", version.ref = "cassandra-analytics" }
cassandra-analytics-spark-converter = { module = "org.apache.cassandra:cassandra-analytics-spark-converter_spark3_2.13", version.ref = "cassandra-analytics" }
cassandra-analytics-sidecar-client = { module = "org.apache.cassandra:cassandra-analytics-sidecar-client", version.ref = "cassandra-analytics" }
