plugins {
    id('java-library')
    id('com.gradleup.shadow')
}

ext.dtestJar = System.getenv("DTEST_JAR") ?: "dtest-${project.datastaxCassandra4Version}.jar"
def dtestJarFullPath = "${rootDir}/dependencies/${ext.dtestJar}"

dependencies {
    implementation("org.apache.cassandra:cassandra-analytics-integration-framework_spark3_${scalaVersion}:${analyticsVersion}")

    println("Using DTest JAR: " + dtestJarFullPath)
    // The dtest jar must be a compile only dependency. We want to avoid having this jar in the
    // classpath while running integration tests. Instead, a dedicated classloader will load the
    // dtest jar while provisioning the in-jvm dtest Cassandra cluster
    compileOnly(files("${dtestJarFullPath}"))
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier = ""
    zip64 = true
}