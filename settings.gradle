rootProject.name = 'cassandra-analytics-ext'
include 'cassandra-analytics-core-ext'
include 'cassandra-four-nine'
include 'cassandra-four-nine-avro-converter'
include 'cassandra-four-nine-bridge'
include 'cassandra-four-nine-types'
include 'cassandra-analytics-spark-four-nine-converter'
include 'cassandra-analytics-example-hcd'
include 'cassandra-analytics-integration-framework'
include 'cassandra-analytics-integration-tests'

// add cassandra-analytics-m2-repository/ for pre-compiled jarfiles for binary releases
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) // or FAIL_ON_PROJECT_REPOS
  repositories {
    maven { url = uri("$rootDir/cassandra-analytics-m2-repository") }
    mavenLocal()
    mavenCentral()
  }
}