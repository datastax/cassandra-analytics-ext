plugins {
    id('java-library')
    id('com.gradleup.shadow')
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation libs.cassandra.five.zero.bridge

    compileOnly project(path: ':cassandra-four-nine', configuration: 'shadow')
    compileOnly project(path: ':cassandra-four-nine-types', configuration: 'shadow')

    compileOnly libs.cassandra.analytics.common
    compileOnly("org.apache.cassandra:cassandra-bridge_spark3_${scalaVersion}:${analyticsVersion}")
    compileOnly("org.apache.cassandra:cassandra-analytics-spark-converter_spark3_${scalaVersion}:${analyticsVersion}")

    compileOnly libs.slf4j.api
    compileOnly libs.kryo.shaded
    compileOnly libs.guava
    compileOnly libs.jackson.annotations
    compileOnly libs.jackson.core
    compileOnly libs.jackson.databind

    testImplementation libs.cassandra.analytics.common
    testImplementation("org.apache.cassandra:cassandra-bridge_spark3_${scalaVersion}:${analyticsVersion}")
    testImplementation("org.apache.cassandra:cassandra-analytics-spark-converter_spark3_${scalaVersion}:${analyticsVersion}")
    testImplementation project(path: ':cassandra-analytics-spark-four-nine-converter', configuration: 'shadow')
    testImplementation project(path: ':cassandra-four-nine', configuration: 'shadow')
    testImplementation project(path: ':cassandra-four-nine-types', configuration: 'shadow')

    testImplementation libs.junit.jupiter.api
    testImplementation libs.junit.jupiter.params
    testImplementation libs.junit.jupiter.engine
    testImplementation libs.assertj.core
    testImplementation libs.quicktheories
    testImplementation libs.mockito.core

    testImplementation("org.apache.spark:spark-core_${scalaVersion}:${sparkVersion}")
    testImplementation("org.apache.spark:spark-sql_${scalaVersion}:${sparkVersion}")
    testImplementation libs.jna
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName = 'four-zero-bridge.jar'
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    doFirst {
        if (JavaVersion.current().isJava11Compatible()) {
            def JDK11_OPTIONS = ['-Djdk.attach.allowAttachSelf=true',
                                 '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                                 '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
                                 '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
                                 '--add-exports', 'java.management.rmi/com.sun.jmx.remote.internal.rmi=ALL-UNNAMED',
                                 '--add-exports', 'java.rmi/sun.rmi.registry=ALL-UNNAMED',
                                 '--add-exports', 'java.rmi/sun.rmi.server=ALL-UNNAMED',
                                 '--add-exports', 'java.sql/java.sql=ALL-UNNAMED',
                                 '--add-opens', 'java.base/java.lang.module=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.loader=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.reflect=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.math=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.module=ALL-UNNAMED',
                                 '--add-opens', 'java.base/jdk.internal.util.jar=ALL-UNNAMED',
                                 '--add-opens', 'jdk.management/com.sun.management.internal=ALL-UNNAMED']
            jvmArgs(JDK11_OPTIONS)
            println("JVM arguments for $project.name are $allJvmArgs")
        }
    }
    systemProperty "cassandra.analytics.bridges.sstable_format", "bti"
    useJUnitPlatform()
    reports {
        def destDir = Paths.get(rootProject.rootDir.absolutePath, "build", "test-reports", "four-nine-bridge").toFile()
        junitXml {
            enabled true
            destination = destDir
        }
        html {
            enabled true
            destination = destDir
        }
    }
}
