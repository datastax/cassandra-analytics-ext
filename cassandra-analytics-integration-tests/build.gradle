plugins {
    id('java-library')
}

configurations {
    // remove netty-all dependency coming from spark
    all*.exclude(group: 'io.netty', module: 'netty-all')
    configureEach {
        resolutionStrategy {
            // Force set the vertx versions that do not depend on a newer jackson version
            force("io.vertx:vertx-web:4.5.1")
            force("io.vertx:vertx-core:4.5.1")
            force("io.vertx:vertx-auth-common:4.5.1")
            force("io.vertx:vertx-dropwizard-metrics:4.5.1")
            force("io.vertx:vertx-web-client:4.5.1")
        }
    }
}

dependencies {
    implementation libs.jackson.annotations

    testImplementation libs.junit.jupiter
    testImplementation project(path: ':cassandra-analytics-core-ext', configuration: 'shadow')
    testImplementation project(path: ':cassandra-analytics-integration-framework', configuration: 'shadow')
    testImplementation libs.spark.core
    testImplementation libs.spark.sql
    testImplementation libs.spark.catalyst
    testImplementation libs.cassandra.analytics.spark.converter
    testImplementation libs.cassandra.analytics.bridge
    testImplementation libs.cassandra.analytics.sidecar.client
    testImplementation libs.kryo.shaded
}

test {
    // Because system properties aren't passed from the command line through to tests, we need to specifically
    // set them again here.
    systemProperty "cassandra.test.dtest_jar_path", "${rootDir}/dependencies/"
    systemProperty "cassandra.sidecar.versions_to_test", (System.getenv("CASSANDRA_VERSION") ?: "4.0")
    systemProperty "SKIP_STARTUP_VALIDATIONS", "true"
    systemProperty "logback.configurationFile", "src/test/resources/logback-test.xml"
    systemProperty "cassandra.integration.sidecar.test.enable_mtls", "false"
    minHeapSize = '1g'
    maxHeapSize = System.getenv("INTEGRATION_MAX_HEAP_SIZE") ?: "2048M"
    maxParallelForks = 1
    forkEvery = 1  // Enables different end-to-end test classes use Spark contexts with different configurations

    beforeTest { descriptor ->
        // println("Setting test tags to ${descriptor.className}-${descriptor.name}")
        systemProperty "cassandra.testtag", "${descriptor.className}"
        systemProperty "suitename", "${descriptor.name}"
    }

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }

    if (JavaVersion.current().isJava11Compatible()) {
        def JDK11_OPTIONS = ['-Djdk.attach.allowAttachSelf=true',
                             '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                             '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
                             '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
                             '--add-exports', 'java.management.rmi/com.sun.jmx.remote.internal.rmi=ALL-UNNAMED',
                             '--add-exports', 'java.rmi/sun.rmi.registry=ALL-UNNAMED',
                             '--add-exports', 'java.rmi/sun.rmi.server=ALL-UNNAMED',
                             '--add-exports', 'java.sql/java.sql=ALL-UNNAMED',
                             '--add-opens', 'java.base/java.lang.module=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.loader=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.reflect=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.math=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.module=ALL-UNNAMED',
                             '--add-opens', 'java.base/jdk.internal.util.jar=ALL-UNNAMED',
                             '--add-opens', 'jdk.management/com.sun.management.internal=ALL-UNNAMED']
        jvmArgs(JDK11_OPTIONS)
        println("JVM arguments for $project.name are $allJvmArgs")
    }

    useJUnitPlatform()
    def destDir = Paths.get(rootProject.rootDir.absolutePath, "build", "test-reports", "integration").toFile()
    reports {
        junitXml {
            enabled true
            destination = destDir
        }
        html {
            enabled true
            destination = destDir
        }
    }
}
